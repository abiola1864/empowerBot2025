<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Configurations — EmpowerBot</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F1F5F9;--sf:#FFFFFF;--sf2:#F8FAFC;--sf3:#F1F5F9;
  --bd:#E2E8F0;--bd2:#CBD5E1;
  --ac:#2563EB;--ac-bg:rgba(37,99,235,.06);--ac-bg2:rgba(37,99,235,.12);
  --ok:#16A34A;--ok-bg:rgba(22,163,74,.07);--ok-bg2:rgba(22,163,74,.14);
  --er:#DC2626;--er-bg:rgba(220,38,38,.07);
  --wn:#D97706;--wn-bg:rgba(217,119,6,.08);
  --pu:#7C3AED;--pu-bg:rgba(124,58,237,.07);
  --t1:#0F172A;--t2:#475569;--t3:#94A3B8;
  --r:8px;--rl:12px;
  --shadow:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
  --shadow-md:0 4px 12px rgba(0,0,0,.08);
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--t1);font-size:14px;-webkit-font-smoothing:antialiased;min-height:100vh;}
button,input,select,textarea{font-family:inherit;}

/* REDIRECT LOCK (if not authed, show briefly) */
#noauth{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:99;}
#noauth.gone{display:none;}
.na-msg{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:28px 32px;text-align:center;box-shadow:var(--shadow-md);}
.na-msg h3{font-size:15px;font-weight:600;margin-bottom:6px;}
.na-msg p{font-size:13px;color:var(--t2);}

/* HEADER */
.hdr{background:var(--sf);border-bottom:1px solid var(--bd);padding:0 24px;display:flex;align-items:center;gap:14px;height:56px;position:sticky;top:0;z-index:20;box-shadow:var(--shadow);}
.hdr-logo{width:28px;height:28px;border-radius:7px;background:var(--ac-bg2);border:1px solid rgba(37,99,235,.15);display:flex;align-items:center;justify-content:center;}
.hdr-logo svg{width:14px;height:14px;stroke:var(--ac);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.hdr-t{font-size:14.5px;font-weight:700;color:var(--t1);}
.hdr-sep{width:1px;height:18px;background:var(--bd);margin:0 4px;}
.hdr-cr{font-size:12.5px;color:var(--t2);}
.hdr-sp{flex:1;}
.nav-links{display:flex;gap:3px;}
.nav-a{padding:5px 11px;border-radius:6px;font-size:12px;font-weight:500;color:var(--t2);text-decoration:none;transition:all .12s;}
.nav-a:hover{background:var(--sf2);color:var(--t1);}
.nav-a.here{background:var(--ac-bg2);color:var(--ac);}

/* MAIN LAYOUT */
#app{display:none;}
#app.show{display:block;}
.layout{display:grid;grid-template-columns:260px 1fr;min-height:calc(100vh - 56px);}

/* LEFT PANEL */
.lp{background:var(--sf);border-right:1px solid var(--bd);display:flex;flex-direction:column;position:sticky;top:56px;height:calc(100vh - 56px);overflow-y:auto;}
.lp::-webkit-scrollbar{width:3px;}.lp::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:2px;}
.lp-head{padding:16px 16px 12px;border-bottom:1px solid var(--bd);}
.lp-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--t3);margin-bottom:12px;}
.new-cfg-btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:9px;border-radius:var(--r);border:1.5px dashed var(--bd2);background:transparent;color:var(--t2);font-size:12.5px;font-weight:600;cursor:pointer;transition:all .15s;}
.new-cfg-btn:hover{border-color:var(--ac);color:var(--ac);background:var(--ac-bg);}
.new-cfg-btn svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;}
.cfg-list{flex:1;padding:8px;}
.cfg-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--r);cursor:pointer;transition:background .1s;border:1px solid transparent;margin-bottom:3px;}
.cfg-item:hover{background:var(--sf2);}
.cfg-item.active{background:var(--sf2);border-color:var(--bd);}
.cfg-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.cfg-body{flex:1;min-width:0;}
.cfg-name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--t1);}
.cfg-meta{font-size:11px;color:var(--t3);margin-top:1px;}
.cfg-uc{font-size:10px;padding:2px 7px;border-radius:20px;font-weight:600;background:var(--sf3);color:var(--t2);border:1px solid var(--bd);flex-shrink:0;}
.lp-foot{padding:12px 14px;border-top:1px solid var(--bd);font-size:11.5px;color:var(--t3);}

/* RIGHT PANEL */
.rp{padding:24px;}
.rp-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:400px;gap:10px;color:var(--t3);}
.rp-empty svg{width:40px;height:40px;stroke:currentColor;fill:none;stroke-width:1.2;opacity:.35;}
.rp-empty h3{font-size:15px;font-weight:600;color:var(--t2);}
.rp-empty p{font-size:13px;text-align:center;max-width:280px;line-height:1.6;}

/* EDITOR CARD */
.ecard{background:var(--sf);border:1px solid var(--bd);border-radius:var(--rl);margin-bottom:16px;box-shadow:var(--shadow);overflow:hidden;}
.ecard-h{padding:13px 18px;border-bottom:1px solid var(--bd);background:var(--sf2);display:flex;align-items:center;gap:8px;}
.ecard-h svg{width:15px;height:15px;stroke:var(--t2);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.ecard-ht{font-size:13px;font-weight:600;color:var(--t1);}
.ecard-b{padding:18px 20px;}

/* FORM */
.fl{margin-bottom:14px;}
.flb{font-size:11.5px;font-weight:600;color:var(--t2);margin-bottom:6px;}
.fi{width:100%;padding:9px 12px;background:var(--sf2);border:1.5px solid var(--bd);border-radius:7px;color:var(--t1);font-size:13.5px;outline:none;transition:border-color .15s,box-shadow .15s;}
.fi:focus{border-color:var(--ac);box-shadow:0 0 0 3px var(--ac-bg);}.fi::placeholder{color:var(--t3);}

/* COLOR CHIPS */
.color-row{display:flex;gap:8px;flex-wrap:wrap;}
.cchip{width:26px;height:26px;border-radius:50%;cursor:pointer;border:2.5px solid transparent;transition:all .15s;display:flex;align-items:center;justify-content:center;}
.cchip.sel{border-color:var(--t1);transform:scale(1.18);}
.cchip svg{width:11px;height:11px;stroke:#fff;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;}

/* FEATURE GRID */
.feat-section{margin-bottom:16px;}
.feat-section-title{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--t3);margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid var(--bd);}
.feat-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px;}
.feat-item{display:flex;align-items:flex-start;gap:9px;padding:9px 11px;border-radius:7px;cursor:pointer;transition:background .1s;user-select:none;border:1px solid transparent;}
.feat-item:hover{background:var(--sf2);}
.feat-item.checked{background:rgba(37,99,235,.04);border-color:rgba(37,99,235,.12);}
.fcb{width:16px;height:16px;border-radius:4px;border:1.5px solid var(--bd2);background:var(--sf2);display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;transition:all .15s;}
.feat-item.checked .fcb{background:var(--ac);border-color:var(--ac);}
.fcb svg{width:9px;height:9px;stroke:#fff;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:0;transition:opacity .12s;}
.feat-item.checked .fcb svg{opacity:1;}
.feat-name{font-size:12.5px;font-weight:500;color:var(--t1);}
.feat-desc{font-size:11px;color:var(--t3);margin-top:1px;line-height:1.4;}

/* QUIZ CHIPS */
.quiz-grid{display:flex;flex-wrap:wrap;gap:6px;}
.quiz-chip{padding:4px 11px;border-radius:20px;font-size:12px;font-family:'JetBrains Mono',monospace;cursor:pointer;border:1.5px solid var(--bd);background:var(--sf2);color:var(--t2);transition:all .15s;user-select:none;}
.quiz-chip:hover{border-color:var(--bd2);color:var(--t1);}
.quiz-chip.sel{background:var(--ac-bg2);border-color:var(--ac);color:var(--ac);}

/* USERS TABLE */
.users-srch{width:100%;padding:8px 11px;background:var(--sf2);border:1px solid var(--bd);border-radius:7px;color:var(--t1);font-size:12.5px;outline:none;margin-bottom:12px;}
.users-srch:focus{border-color:var(--ac);}
.users-srch::placeholder{color:var(--t3);}
.utbl{width:100%;border-collapse:collapse;}
.utbl th{padding:8px 12px;text-align:left;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--t3);border-bottom:1px solid var(--bd);}
.utbl td{padding:9px 12px;font-size:12.5px;border-bottom:1px solid var(--bd);}
.utbl tr:last-child td{border-bottom:none;}
.utbl tr:hover td{background:var(--sf2);}
.ucfg-sel{padding:5px 8px;background:var(--sf2);border:1px solid var(--bd);border-radius:6px;color:var(--t1);font-size:12px;outline:none;cursor:pointer;}
.ucfg-sel:focus{border-color:var(--ac);}

/* SAVE BAR */
.save-bar{position:sticky;bottom:0;background:var(--sf);border-top:1px solid var(--bd);padding:13px 20px;display:flex;gap:8px;align-items:center;margin:0 -20px;box-shadow:0 -2px 8px rgba(0,0,0,.05);}
.btn{display:inline-flex;align-items:center;gap:5px;padding:8px 16px;border-radius:8px;border:none;font-size:13px;font-weight:600;cursor:pointer;transition:all .12s;}
.btn:active{transform:scale(.97);}
.bp{background:var(--ac);color:#fff;box-shadow:0 1px 4px rgba(37,99,235,.25);}.bp:hover{opacity:.9;}
.bs{background:var(--sf2);color:var(--t1);border:1px solid var(--bd);}.bs:hover{border-color:var(--bd2);}
.bd-btn{color:var(--er);background:var(--er-bg);}.bd-btn:hover{background:rgba(220,38,38,.14);}
.btn svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;}

/* TOAST */
.tray{position:fixed;bottom:20px;right:20px;display:flex;flex-direction:column;gap:7px;z-index:200;}
.t{display:flex;align-items:center;gap:8px;padding:10px 15px;border-radius:9px;font-size:13px;font-weight:500;min-width:230px;box-shadow:var(--shadow-md);animation:ti .25s ease;}
.t svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;}
@keyframes ti{from{transform:translateX(14px);opacity:0}to{transform:translateX(0);opacity:1}}
.tok{background:#F0FDF4;border:1px solid rgba(22,163,74,.3);color:var(--ok);}
.ter{background:#FEF2F2;border:1px solid rgba(220,38,38,.3);color:var(--er);}
</style>
</head>
<body>

<div id="noauth">
  <div class="na-msg">
    <h3>Please log in first</h3>
    <p>Redirecting to quiz editor to unlock...</p>
  </div>
</div>

<div id="app">
  <div class="hdr">
    <div class="hdr-logo"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M4.93 4.93a10 10 0 0 0 0 14.14"/></svg></div>
    <div class="hdr-t">EmpowerBot</div>
    <div class="hdr-sep"></div>
    <div class="hdr-cr">Configurations</div>
    <div class="hdr-sp"></div>
    <div class="nav-links">
      <a class="nav-a" href="/quizeditor">Quiz editor</a>
      <a class="nav-a here" href="/configurations">Configurations</a>
      <a class="nav-a" href="/location-admin">Locations</a>
      <a class="nav-a" href="/engagementdashboard">Engagement</a>
    </div>
  </div>

  <div class="layout">
    <!-- LEFT: config list -->
    <div class="lp">
      <div class="lp-head">
        <div class="lp-title">All configurations</div>
        <button class="new-cfg-btn" onclick="newConfig()">
          <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          New configuration
        </button>
      </div>
      <div class="cfg-list" id="cfg-list">
        <div style="padding:20px;text-align:center;font-size:12.5px;color:var(--t3)">Loading...</div>
      </div>
      <div class="lp-foot" id="cfg-foot">—</div>
    </div>

    <!-- RIGHT: editor -->
    <div class="rp" id="rp">
      <div class="rp-empty">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M4.93 4.93a10 10 0 0 0 0 14.14"/></svg>
        <h3>No configuration selected</h3>
        <p>Select a configuration from the list, or create a new one to get started.</p>
      </div>
    </div>
  </div>
</div>
<div class="tray" id="tray"></div>

<script>
const SESSION_KEY='empowerbot_admin_ts';
const SESSION_TTL=24*60*60*1000;
function isUnlocked(){const ts=localStorage.getItem(SESSION_KEY);return ts&&(Date.now()-parseInt(ts)<SESSION_TTL);}

// Check auth on load
window.addEventListener('DOMContentLoaded',()=>{
  if(isUnlocked()){
    document.getElementById('noauth').classList.add('gone');
    document.getElementById('app').classList.add('show');
    loadAll();
  } else {
    setTimeout(()=>window.location.href='/quizeditor',1500);
  }
});

const COLORS=['#2563EB','#16A34A','#DC2626','#D97706','#7C3AED','#EA580C','#0EA5E9','#EC4899'];
const FEATURES=[
  {id:'quiz_modules',name:'Quiz modules',desc:'Access to quiz content and comprehension questions',cat:'Education'},
  {id:'ai_explanations',name:'AI explanations',desc:'AI-generated explanations after answering questions',cat:'Education'},
  {id:'media_in_quizzes',name:'Media in quizzes',desc:'Images/video displayed alongside questions',cat:'Education'},
  {id:'ai_chatbot',name:'AI chatbot',desc:'Free-form AI chat and question review',cat:'Education'},
  {id:'forum_alerts',name:'Forum alerts',desc:'Notifications about upcoming participation forums',cat:'Information'},
  {id:'budget_briefs',name:'Budget briefs',desc:'Plain-language budget summaries with infographics',cat:'Information'},
  {id:'post_forum_feedback',name:'Post-forum feedback',desc:'Summaries of forum proceedings delivered after the event',cat:'Information'},
  {id:'rsvp_checkin',name:'RSVP & attendance',desc:'RSVP for forums and confirm attendance',cat:'Participation'},
  {id:'issue_logging',name:'Issue logging',desc:'Submit issues to raise at forums (timestamped)',cat:'Participation'},
  {id:'submission_templates',name:'Submission templates',desc:'Guided prompts to formulate specific forum inputs',cat:'Participation'},
  {id:'scoreboard',name:'Scoreboard',desc:'Appear on the quiz leaderboard',cat:'Platform'},
  {id:'record_keeping',name:'Record keeping',desc:'Upload and view business records',cat:'Platform'},
];
const CATS=['Education','Information','Participation','Platform'];

let configs=[],quizList=[],curCfg=null,selColor=COLORS[0];

async function loadAll(){
  try{
    const [cr,qr]=await Promise.all([fetch('/api/configs'),fetch('/api/quizzes')]);
    configs=await cr.json();
    const qd=await qr.json();quizList=qd.map(q=>q.quiz);
    renderList();
  }catch(e){toast('Could not load configurations','er');}
}

function renderList(){
  const el=document.getElementById('cfg-list');
  document.getElementById('cfg-foot').textContent=configs.length+' configuration'+(configs.length!==1?'s':'');
  if(!configs.length){
    el.innerHTML='<div style="padding:24px 16px;text-align:center;font-size:12.5px;color:var(--t3);line-height:1.6">No configurations yet.<br>Click "New configuration" to create your first one.</div>';
    return;
  }
  el.innerHTML='';
  configs.forEach(c=>{
    const d=document.createElement('div');
    d.className='cfg-item'+(curCfg&&curCfg._id===c._id?' active':'');
    d.dataset.id=c._id;
    d.innerHTML=`<div class="cfg-dot" style="background:${c.color||'#2563EB'}"></div>
      <div class="cfg-body">
        <div class="cfg-name">${esc(c.name)}</div>
        <div class="cfg-meta">${(c.features||[]).length} features · ${(c.quizzes||[]).length} quizzes</div>
      </div>
      <div class="cfg-uc">${c.user_count||0} users</div>`;
    d.onclick=()=>selConfig(c);
    el.appendChild(d);
  });
}

function selConfig(c){
  curCfg=c;selColor=c.color||COLORS[0];
  document.querySelectorAll('.cfg-item').forEach(el=>el.classList.remove('active'));
  const el=document.querySelector(`[data-id="${c._id}"]`);if(el)el.classList.add('active');
  renderEditor(c);
}

function renderEditor(c){
  const rp=document.getElementById('rp');
  const selFeats=c.features||[];
  const selQuizzes=c.quizzes||[];

  const colorChips=COLORS.map(col=>`<div class="cchip${col===selColor?' sel':''}" style="background:${col}" data-col="${col}" onclick="pickColor('${col}')">${col===selColor?`<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>`:''}</div>`).join('');

  const featHtml=CATS.map(cat=>{
    const feats=FEATURES.filter(f=>f.cat===cat);
    return `<div class="feat-section">
      <div class="feat-section-title">${cat}</div>
      <div class="feat-grid">${feats.map(f=>`<div class="feat-item${selFeats.includes(f.id)?' checked':''}" id="feat-${f.id}" onclick="toggleFeat('${f.id}')">
        <div class="fcb"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></div>
        <div><div class="feat-name">${f.name}</div><div class="feat-desc">${f.desc}</div></div>
      </div>`).join('')}</div>
    </div>`;
  }).join('');

  const quizChips=quizList.map(q=>`<div class="quiz-chip${selQuizzes.includes(q)?' sel':''}" id="qchip-${q}" onclick="toggleQuiz('${q}')">${q}</div>`).join('');

  rp.innerHTML=`
    <div style="max-width:860px">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:18px">
        <div>
          <h2 style="font-size:18px;font-weight:700;letter-spacing:-.2px">${esc(c.name)}</h2>
          <p style="font-size:12.5px;color:var(--t2);margin-top:3px">${c.user_count||0} users assigned · last updated ${c.updated_at?new Date(c.updated_at).toLocaleDateString('en-GB',{day:'numeric',month:'short'}):'—'}</p>
        </div>
      </div>

      <!-- DETAILS -->
      <div class="ecard">
        <div class="ecard-h"><svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg><span class="ecard-ht">Details</span></div>
        <div class="ecard-b">
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
            <div class="fl"><div class="flb">Configuration name</div>
              <input class="fi" id="cfg-name" type="text" placeholder="e.g. Control, Treatment A, Full access..." value="${esc(c.name)}">
            </div>
            <div class="fl"><div class="flb">Description</div>
              <input class="fi" id="cfg-desc" type="text" placeholder="Brief description..." value="${esc(c.description||'')}">
            </div>
          </div>
          <div class="fl"><div class="flb">Colour label</div><div class="color-row">${colorChips}</div></div>
        </div>
      </div>

      <!-- FEATURES -->
      <div class="ecard">
        <div class="ecard-h"><svg viewBox="0 0 24 24"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg><span class="ecard-ht">Features</span><span style="font-size:12px;color:var(--t2);margin-left:8px">— choose which features users in this configuration can access</span></div>
        <div class="ecard-b">${featHtml}</div>
      </div>

      <!-- QUIZZES -->
      <div class="ecard">
        <div class="ecard-h"><svg viewBox="0 0 24 24"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/></svg><span class="ecard-ht">Quizzes included</span><span style="font-size:12px;color:var(--t2);margin-left:8px">— which quizzes are available to users in this configuration</span></div>
        <div class="ecard-b"><div class="quiz-grid" style="padding:2px 0">${quizChips||'<span style="font-size:12.5px;color:var(--t3)">No quizzes loaded</span>'}</div></div>
      </div>

      <!-- USERS -->
      <div class="ecard">
        <div class="ecard-h"><svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg><span class="ecard-ht">User assignment</span></div>
        <div class="ecard-b">
          <input class="users-srch" type="text" placeholder="Search users by name or phone..." oninput="filterUsers(this.value)">
          <div id="users-tbl-wrap"><div style="padding:16px;text-align:center;font-size:12.5px;color:var(--t3)">Loading users...</div></div>
        </div>
      </div>

      <div class="save-bar">
        <button class="btn bp" onclick="saveCfg()">
          <svg viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13"/><polyline points="7 3 7 8 15 8"/></svg>
          Save configuration
        </button>
        <button class="btn bd-btn" onclick="delCfg()">Delete</button>
      </div>
    </div>`;

  loadUsers();
}

async function loadUsers(){
  try{
    const r=await fetch('/api/users/config-list');
    const users=await r.json();
    renderUsers(users);
  }catch(e){
    const w=document.getElementById('users-tbl-wrap');
    if(w)w.innerHTML='<div style="padding:12px;color:var(--t3);font-size:12.5px">Could not load users</div>';
  }
}

function renderUsers(users){
  const w=document.getElementById('users-tbl-wrap');if(!w)return;
  if(!users.length){w.innerHTML='<div style="padding:12px;color:var(--t3);font-size:12.5px">No users registered yet</div>';return;}
  const rows=users.map(u=>{
    const opts='<option value="">— none —</option>'+configs.map(c=>`<option value="${c._id}"${(u.configuration===c._id||u.configuration===c.name)?'selected':''}>${esc(c.name)}</option>`).join('');
    const cfgInfo=configs.find(c=>c._id===u.configuration||c.name===u.configuration);
    const badge=cfgInfo?`<span style="display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:600;padding:2px 8px;border-radius:20px;background:${cfgInfo.color+'18'};color:${cfgInfo.color};border:1px solid ${cfgInfo.color+'33'}">${esc(cfgInfo.name)}</span>`:'<span style="font-size:11px;color:var(--t3)">—</span>';
    return`<tr>
      <td style="font-weight:500">${esc(u.name||'—')}</td>
      <td style="color:var(--t2);font-size:11.5px">${(u.phone_number||'').slice(0,8)}***</td>
      <td style="color:var(--t2)">${esc(u.location||'—')}</td>
      <td>${badge}</td>
      <td><select class="ucfg-sel" onchange="assignUser('${u._id}',this.value)">${opts}</select></td>
    </tr>`;
  }).join('');
  w.innerHTML=`<table class="utbl"><thead><tr><th>Name</th><th>Phone</th><th>Location</th><th>Current config</th><th>Assign to</th></tr></thead><tbody id="utbody">${rows}</tbody></table>`;
}

function filterUsers(v){
  [...document.querySelectorAll('#utbody tr')].forEach(r=>{r.style.display=r.textContent.toLowerCase().includes(v.toLowerCase())?'':'none';});
}

async function assignUser(userId,cfgId){
  try{
    await fetch('/api/users/assign-config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user_id:userId,config_id:cfgId})});
    toast('User assignment updated','ok');
    await loadAll();
  }catch(e){toast('Assignment failed','er');}
}

function pickColor(col){
  selColor=col;
  document.querySelectorAll('.cchip').forEach(c=>{
    const isThis=c.dataset.col===col;c.classList.toggle('sel',isThis);
    c.innerHTML=isThis?`<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>`:'';
  });
}

function toggleFeat(id){const el=document.getElementById('feat-'+id);if(el)el.classList.toggle('checked');}
function toggleQuiz(q){const el=document.getElementById('qchip-'+q);if(el)el.classList.toggle('sel');}
function getSelFeats(){return[...document.querySelectorAll('.feat-item.checked')].map(el=>el.id.replace('feat-',''));}
function getSelQuizzes(){return[...document.querySelectorAll('.quiz-chip.sel')].map(el=>el.id.replace('qchip-',''));}

async function saveCfg(){
  if(!curCfg)return;
  const name=(document.getElementById('cfg-name')||{value:''}).value.trim();
  if(!name){toast('Configuration name is required','er');return;}
  const payload={name,description:(document.getElementById('cfg-desc')||{value:''}).value.trim(),color:selColor,features:getSelFeats(),quizzes:getSelQuizzes()};
  try{
    const r=await fetch('/api/configs/'+curCfg._id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    if(r.ok){toast('Configuration saved','ok');await loadAll();const updated=configs.find(c=>c._id===curCfg._id);if(updated){curCfg=updated;selConfig(updated);}}
    else toast('Save failed','er');
  }catch(e){toast('Network error','er');}
}

async function delCfg(){
  if(!curCfg)return;
  if(!confirm(`Delete "${curCfg.name}"? Users assigned to it will be unassigned.`))return;
  try{
    const r=await fetch('/api/configs/'+curCfg._id,{method:'DELETE'});
    if(r.ok){toast('Deleted','ok');curCfg=null;await loadAll();document.getElementById('rp').innerHTML='<div class="rp-empty"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M4.93 4.93a10 10 0 0 0 0 14.14"/></svg><h3>Configuration deleted</h3><p>Select or create another configuration.</p></div>';}
    else toast('Delete failed','er');
  }catch(e){toast('Network error','er');}
}

async function newConfig(){
  try{
    const r=await fetch('/api/configs',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:'New configuration',description:'',color:COLORS[configs.length%COLORS.length],features:[],quizzes:[]})});
    if(r.ok){const c=await r.json();await loadAll();const found=configs.find(x=>x._id===c._id)||configs[configs.length-1];if(found)selConfig(found);toast('Created — give it a name and save','ok');}
    else toast('Could not create','er');
  }catch(e){toast('Network error','er');}
}

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function toast(msg,type){
  const c=document.getElementById('tray');const t=document.createElement('div');
  t.className='t '+(type==='ok'?'tok':'ter');
  const ico=type==='ok'?`<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>`:`<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>`;
  t.innerHTML=ico+msg;c.appendChild(t);
  setTimeout(()=>{t.style.cssText='opacity:0;transition:opacity .25s;';setTimeout(()=>t.remove(),250);},3500);
}
</script>
</body>
</html>
