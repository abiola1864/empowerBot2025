<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz Editor — EmpowerBot</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #07111C;
  --surface: #0D1E30;
  --surface-2: #152438;
  --surface-3: #1C2E44;
  --border: #1A3050;
  --border-2: #224060;
  --accent: #00BF8F;
  --accent-dim: rgba(0,191,143,0.10);
  --accent-dim2: rgba(0,191,143,0.18);
  --danger: #E85454;
  --danger-dim: rgba(232,84,84,0.10);
  --warning: #F5A524;
  --warning-dim: rgba(245,165,36,0.10);
  --text: #D8E8F6;
  --text-2: #6E90AE;
  --text-3: #364D62;
  --r: 8px;
  --r-lg: 12px;
  --shadow-lg: 0 8px 40px rgba(0,0,0,0.5);
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Inter',sans-serif; background:var(--bg); color:var(--text); height:100vh; overflow:hidden; font-size:14px; }

/* LOCK */
#lock {
  position:fixed; inset:0; background:var(--bg);
  display:flex; align-items:center; justify-content:center;
  z-index:99; transition:opacity 0.45s, transform 0.45s;
}
#lock.out { opacity:0; transform:scale(1.04); pointer-events:none; }

.lock-card {
  background:var(--surface); border:1px solid var(--border);
  border-radius:20px; padding:52px 48px; width:380px;
  box-shadow:var(--shadow-lg);
  display:flex; flex-direction:column; align-items:center;
}
.lock-icon {
  width:56px; height:56px; border-radius:14px;
  background:var(--accent-dim); display:flex;
  align-items:center; justify-content:center;
  margin-bottom:22px;
}
.lock-icon svg { width:26px; height:26px; stroke:var(--accent); fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
.lock-title { font-size:20px; font-weight:600; margin-bottom:6px; }
.lock-sub { font-size:13px; color:var(--text-2); margin-bottom:36px; text-align:center; }

.pin-row { display:flex; gap:10px; margin-bottom:22px; }
.pin-box {
  width:54px; height:62px;
  background:var(--surface-2); border:1.5px solid var(--border);
  border-radius:10px; text-align:center;
  font-size:22px; font-family:'JetBrains Mono',monospace;
  color:var(--text); outline:none;
  transition:border-color 0.2s, box-shadow 0.2s;
}
.pin-box:focus { border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-dim); }
.pin-box.err { border-color:var(--danger); animation:shake 0.35s ease; }
@keyframes shake { 0%,100%{transform:translateX(0)} 25%,75%{transform:translateX(-5px)} 50%{transform:translateX(5px)} }

.unlock-btn {
  width:100%; padding:13px; background:var(--accent);
  color:#03120C; border:none; border-radius:10px;
  font-size:14px; font-weight:600; cursor:pointer;
  transition:opacity 0.15s, transform 0.1s;
}
.unlock-btn:hover { opacity:0.88; }
.unlock-btn:active { transform:scale(0.98); }
.lock-err { margin-top:14px; font-size:12.5px; color:var(--danger); min-height:16px; }

/* LAYOUT */
#app { display:flex; height:100vh; opacity:0; transition:opacity 0.4s 0.25s; }
#app.show { opacity:1; }

/* SIDEBAR */
.sidebar {
  width:252px; min-width:252px;
  background:var(--surface); border-right:1px solid var(--border);
  display:flex; flex-direction:column; overflow:hidden;
}
.sb-head { padding:18px 18px 14px; border-bottom:1px solid var(--border); }
.sb-brand { display:flex; align-items:center; gap:10px; margin-bottom:14px; }
.sb-brand-icon {
  width:30px; height:30px; border-radius:8px;
  background:var(--accent-dim); display:flex;
  align-items:center; justify-content:center;
}
.sb-brand-icon svg { width:16px; height:16px; stroke:var(--accent); fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
.sb-brand-name { font-size:13px; font-weight:600; color:var(--text); }
.sb-brand-sub { font-size:11px; color:var(--text-3); margin-top:1px; }

.sb-search { position:relative; }
.sb-search input {
  width:100%; padding:8px 10px 8px 32px;
  background:var(--surface-2); border:1px solid var(--border);
  border-radius:6px; color:var(--text); font-size:12.5px;
  outline:none; transition:border-color 0.2s;
}
.sb-search input:focus { border-color:var(--accent); }
.sb-search input::placeholder { color:var(--text-3); }
.sb-search-ic {
  position:absolute; left:9px; top:50%; transform:translateY(-50%);
  display:flex;
}
.sb-search-ic svg { width:13px; height:13px; stroke:var(--text-3); fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }

.sb-list { flex:1; overflow-y:auto; padding:6px 0; }
.sb-list::-webkit-scrollbar { width:3px; }
.sb-list::-webkit-scrollbar-thumb { background:var(--border-2); border-radius:2px; }

.q-item {
  display:flex; align-items:center; padding:9px 18px;
  cursor:pointer; gap:9px; transition:background 0.12s;
}
.q-item:hover { background:var(--surface-2); }
.q-item.active { background:var(--accent-dim); }
.q-item.active .q-item-name { color:var(--accent); }

.q-dot { width:6px; height:6px; border-radius:50%; flex-shrink:0; background:var(--text-3); }
.q-item.on .q-dot { background:var(--accent); }
.q-item.off .q-dot { background:var(--danger); }
.q-item.active .q-dot { background:var(--accent); }

.q-item-info { flex:1; min-width:0; }
.q-item-name { font-size:12.5px; font-weight:500; font-family:'JetBrains Mono',monospace; color:var(--text); }
.q-item-meta { font-size:11px; color:var(--text-3); margin-top:1px; }

.q-badge {
  font-size:9.5px; padding:2px 6px; border-radius:20px;
  font-weight:600; flex-shrink:0; letter-spacing:0.4px;
}
.badge-on { background:var(--accent-dim2); color:var(--accent); }
.badge-off { background:var(--danger-dim); color:var(--danger); }

.sb-foot { padding:12px 18px; border-top:1px solid var(--border); font-size:11.5px; color:var(--text-3); }

/* MAIN */
.main { flex:1; display:flex; flex-direction:column; overflow:hidden; }

.main-head {
  padding:18px 26px; border-bottom:1px solid var(--border);
  display:flex; align-items:center; justify-content:space-between;
  background:var(--surface); min-height:66px;
}
.mh-left h1 { font-size:17px; font-weight:600; }
.mh-left p { font-size:12.5px; color:var(--text-2); margin-top:2px; }

.mh-right { display:flex; align-items:center; gap:10px; }

.toggle-wrap { display:flex; align-items:center; gap:7px; }
.toggle-lbl { font-size:12.5px; color:var(--text-2); }
.toggle {
  width:38px; height:21px; background:var(--surface-3);
  border-radius:10.5px; position:relative; cursor:pointer;
  border:1px solid var(--border); transition:background 0.2s, border-color 0.2s;
}
.toggle.on { background:var(--accent); border-color:var(--accent); }
.toggle::after {
  content:''; position:absolute; top:2px; left:2px;
  width:15px; height:15px; border-radius:50%; background:#fff;
  transition:transform 0.2s;
}
.toggle.on::after { transform:translateX(17px); }

.btn {
  padding:8px 16px; border-radius:7px; font-size:12.5px;
  font-weight:600; cursor:pointer; border:none;
  transition:opacity 0.15s, transform 0.1s;
  display:flex; align-items:center; gap:5px;
}
.btn:active { transform:scale(0.97); }
.btn-primary { background:var(--accent); color:#03120C; }
.btn-primary:hover { opacity:0.87; }
.btn-secondary { background:var(--surface-2); color:var(--text); border:1px solid var(--border); }
.btn-secondary:hover { border-color:var(--border-2); }
.btn-danger { background:var(--danger-dim); color:var(--danger); }
.btn-danger:hover { background:rgba(232,84,84,0.2); }

/* STATS BAR */
.stats-bar {
  display:flex; gap:0; border-bottom:1px solid var(--border);
  background:var(--surface);
}
.stat { padding:10px 24px; display:flex; align-items:center; gap:10px; border-right:1px solid var(--border); }
.stat-val { font-size:18px; font-weight:600; font-family:'JetBrains Mono',monospace; color:var(--text); }
.stat-lbl { font-size:11px; color:var(--text-3); text-transform:uppercase; letter-spacing:0.6px; }

/* CONTENT */
.main-body { flex:1; overflow-y:auto; padding:22px 26px; }
.main-body::-webkit-scrollbar { width:4px; }
.main-body::-webkit-scrollbar-thumb { background:var(--border-2); border-radius:2px; }

.empty {
  display:flex; flex-direction:column; align-items:center;
  justify-content:center; height:100%; gap:10px; color:var(--text-3);
}
.empty svg { width:40px; height:40px; stroke:var(--text-3); fill:none; stroke-width:1.5; opacity:0.5; }
.empty-title { font-size:15px; font-weight:500; }
.empty-sub { font-size:12.5px; }

/* QUESTION CARD */
.q-card {
  background:var(--surface); border:1px solid var(--border);
  border-radius:var(--r); margin-bottom:10px; overflow:hidden;
  transition:border-color 0.2s;
}
.q-card:hover { border-color:var(--border-2); }
.q-card.editing { border-color:var(--accent); }

.q-head {
  padding:14px 18px; display:flex; align-items:center;
  gap:12px; cursor:pointer; user-select:none;
}
.q-num {
  font-family:'JetBrains Mono',monospace; font-size:10.5px;
  font-weight:500; color:var(--accent); background:var(--accent-dim);
  padding:2px 7px; border-radius:4px; flex-shrink:0;
}
.q-prev { flex:1; font-size:13.5px; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.q-chev { color:var(--text-3); transition:transform 0.2s; font-size:13px; flex-shrink:0; }
.q-chev svg { width:16px; height:16px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
.q-card.open .q-chev { transform:rotate(180deg); color:var(--accent); }

.q-body { display:none; padding:0 18px 18px; border-top:1px solid var(--border); }
.q-card.open .q-body { display:block; }

.field { margin-top:14px; }
.field-lbl {
  font-size:10.5px; font-weight:600; text-transform:uppercase;
  letter-spacing:0.7px; color:var(--text-3); margin-bottom:7px;
}
.field-inp {
  width:100%; padding:10px 12px;
  background:var(--surface-2); border:1.5px solid var(--border);
  border-radius:6px; color:var(--text); font-size:13.5px;
  font-family:'Inter',sans-serif; outline:none;
  transition:border-color 0.2s, box-shadow 0.2s; resize:vertical;
}
.field-inp:focus { border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-dim); }

.opts { display:flex; flex-direction:column; gap:7px; }
.opt-row { display:flex; align-items:center; gap:8px; }
.opt-letter { font-family:'JetBrains Mono',monospace; font-size:12px; font-weight:500; color:var(--text-3); width:18px; flex-shrink:0; text-align:center; }
.opt-inp {
  flex:1; padding:8px 11px;
  background:var(--surface-2); border:1.5px solid var(--border);
  border-radius:6px; color:var(--text); font-size:13px;
  font-family:'Inter',sans-serif; outline:none;
  transition:border-color 0.2s;
}
.opt-inp:focus { border-color:var(--accent); }

.opt-chk {
  width:30px; height:30px; border-radius:50%;
  border:1.5px solid var(--border); background:transparent;
  cursor:pointer; display:flex; align-items:center; justify-content:center;
  transition:all 0.15s; flex-shrink:0; color:var(--text-3);
}
.opt-chk svg { width:14px; height:14px; stroke:currentColor; fill:none; stroke-width:2.5; stroke-linecap:round; stroke-linejoin:round; }
.opt-chk.sel { background:var(--accent); border-color:var(--accent); color:#03120C; }
.opt-chk:hover:not(.sel) { border-color:var(--accent); color:var(--accent); }

.q-actions {
  display:flex; gap:7px; margin-top:14px;
  padding-top:14px; border-top:1px solid var(--border);
  align-items:center;
}
.q-actions .btn { padding:7px 14px; font-size:12px; }
.saving { display:flex; align-items:center; gap:5px; font-size:12px; color:var(--accent); opacity:0; transition:opacity 0.2s; margin-left:auto; }
.saving.on { opacity:1; }
.spin { width:13px; height:13px; border:2px solid var(--accent-dim2); border-top-color:var(--accent); border-radius:50%; animation:spin 0.6s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }

.add-q-btn {
  display:flex; align-items:center; justify-content:center;
  gap:7px; padding:13px; margin-top:4px;
  background:var(--surface); border:1.5px dashed var(--border);
  border-radius:var(--r); color:var(--text-2); font-size:13px;
  font-weight:500; cursor:pointer; width:100%;
  transition:all 0.15s;
}
.add-q-btn:hover { border-color:var(--accent); color:var(--accent); background:var(--accent-dim); }
.add-q-btn svg { width:16px; height:16px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }

/* SKELETON */
.skel { background:var(--surface); border:1px solid var(--border); border-radius:var(--r); height:52px; position:relative; overflow:hidden; margin-bottom:10px; }
.skel::after { content:''; position:absolute; inset:0; background:linear-gradient(90deg,transparent,rgba(255,255,255,0.025),transparent); animation:shimmer 1.4s infinite; }
@keyframes shimmer { from{transform:translateX(-100%)} to{transform:translateX(100%)} }

/* TOAST */
.toasts { position:fixed; bottom:22px; right:22px; display:flex; flex-direction:column; gap:7px; z-index:200; }
.toast {
  padding:11px 16px; border-radius:7px; font-size:13px; font-weight:500;
  display:flex; align-items:center; gap:7px; min-width:240px;
  animation:tin 0.25s ease;
}
.toast svg { width:16px; height:16px; stroke:currentColor; fill:none; stroke-width:2.5; stroke-linecap:round; stroke-linejoin:round; flex-shrink:0; }
@keyframes tin { from{transform:translateX(16px);opacity:0} to{transform:translateX(0);opacity:1} }
.toast-ok { background:var(--accent-dim2); border:1px solid var(--accent); color:var(--accent); }
.toast-err { background:var(--danger-dim); border:1px solid var(--danger); color:var(--danger); }
</style>
</head>
<body>

<div id="lock">
  <div class="lock-card">
    <div class="lock-icon">
      <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
    </div>
    <div class="lock-title">Quiz editor</div>
    <div class="lock-sub">EmpowerBot admin — enter your 4-digit PIN to continue</div>
    <div class="pin-row">
      <input class="pin-box" type="password" maxlength="1" inputmode="numeric" id="p0">
      <input class="pin-box" type="password" maxlength="1" inputmode="numeric" id="p1">
      <input class="pin-box" type="password" maxlength="1" inputmode="numeric" id="p2">
      <input class="pin-box" type="password" maxlength="1" inputmode="numeric" id="p3">
    </div>
    <button class="unlock-btn" id="unlock-btn">Unlock</button>
    <div class="lock-err" id="lock-err"></div>
  </div>
</div>

<div id="app">
  <aside class="sidebar">
    <div class="sb-head">
      <div class="sb-brand">
        <div class="sb-brand-icon">
          <svg viewBox="0 0 24 24"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/><line x1="9" y1="12" x2="15" y2="12"/><line x1="9" y1="16" x2="12" y2="16"/></svg>
        </div>
        <div>
          <div class="sb-brand-name">Quiz editor</div>
          <div class="sb-brand-sub">EmpowerBot admin</div>
        </div>
      </div>
      <div class="sb-search">
        <span class="sb-search-ic"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg></span>
        <input type="text" placeholder="Filter quizzes..." id="sb-filter" oninput="filterList()">
      </div>
    </div>
    <div class="sb-list" id="sb-list"></div>
    <div class="sb-foot" id="sb-foot">Loading...</div>
  </aside>

  <div class="main">
    <div class="main-head">
      <div class="mh-left">
        <h1 id="mh-title">Select a quiz</h1>
        <p id="mh-sub">Choose from the sidebar to start editing</p>
      </div>
      <div class="mh-right" id="mh-right" style="display:none">
        <div class="toggle-wrap">
          <span class="toggle-lbl" id="tgl-lbl">Enabled</span>
          <div class="toggle on" id="tgl" onclick="toggleEnabled()"></div>
        </div>
        <button class="btn btn-primary" onclick="addQuestion()">
          <svg width="14" height="14" viewBox="0 0 24 24" stroke="currentColor" fill="none" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Add question
        </button>
      </div>
    </div>

    <div class="stats-bar" id="stats-bar" style="display:none">
      <div class="stat">
        <div>
          <div class="stat-val" id="st-q">—</div>
          <div class="stat-lbl">Questions</div>
        </div>
      </div>
      <div class="stat">
        <div>
          <div class="stat-val" id="st-r">—</div>
          <div class="stat-lbl">Responses</div>
        </div>
      </div>
      <div class="stat">
        <div>
          <div class="stat-val" id="st-c">—</div>
          <div class="stat-lbl">Avg correct</div>
        </div>
      </div>
    </div>

    <div class="main-body" id="main-body">
      <div class="empty">
        <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
        <div class="empty-title">No quiz selected</div>
        <div class="empty-sub">Pick a quiz from the left panel to view and edit its questions</div>
      </div>
    </div>
  </div>
</div>

<div class="toasts" id="toasts"></div>

<script>
const CORRECT_SVG = `<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>`;
const CHEV_SVG = `<svg viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>`;
const PLUS_SVG = `<svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>`;

let allQuizzes = [], curQuiz = null, curEnabled = true, questions = [];

const pins = [0,1,2,3].map(i => document.getElementById('p'+i));

pins.forEach((p, i) => {
  p.addEventListener('keydown', e => {
    if (e.key === 'Backspace' && !p.value && i > 0) pins[i-1].focus();
    if (e.key === 'Enter') doUnlock();
  });
  p.addEventListener('input', () => { if (p.value && i < 3) pins[i+1].focus(); });
});
pins[0].focus();

document.getElementById('unlock-btn').onclick = doUnlock;

async function doUnlock() {
  const pin = pins.map(p => p.value).join('');
  try {
    const r = await fetch('/api/admin/verify-pin', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({pin})
    });
    if (r.ok) {
      document.getElementById('lock').classList.add('out');
      setTimeout(() => {
        document.getElementById('lock').style.display = 'none';
        document.getElementById('app').classList.add('show');
        loadQuizzes();
      }, 450);
    } else {
      pins.forEach(p => { p.classList.add('err'); p.value = ''; });
      document.getElementById('lock-err').textContent = 'Incorrect PIN — try again';
      setTimeout(() => pins.forEach(p => p.classList.remove('err')), 400);
      pins[0].focus();
    }
  } catch(e) {
    document.getElementById('lock-err').textContent = 'Could not connect to server';
  }
}

async function loadQuizzes() {
  try {
    const r = await fetch('/api/quizzes');
    allQuizzes = await r.json();
    renderList(allQuizzes);
    document.getElementById('sb-foot').textContent =
      allQuizzes.length + ' quizzes · ' + allQuizzes.filter(q=>q.enabled).length + ' active';
  } catch(e) {
    document.getElementById('sb-foot').textContent = 'Failed to load';
    toast('Could not connect to server','err');
  }
}

function renderList(arr) {
  const el = document.getElementById('sb-list');
  el.innerHTML = '';
  arr.forEach(q => {
    const d = document.createElement('div');
    d.className = 'q-item ' + (q.enabled ? 'on' : 'off');
    d.dataset.n = q.quiz;
    d.innerHTML = `
      <div class="q-dot"></div>
      <div class="q-item-info">
        <div class="q-item-name">${q.quiz}</div>
        <div class="q-item-meta">${q.question_count != null ? q.question_count+' questions' : '—'}</div>
      </div>
      <div class="q-badge ${q.enabled ? 'badge-on':'badge-off'}">${q.enabled?'ON':'OFF'}</div>`;
    d.onclick = () => selectQuiz(q);
    el.appendChild(d);
  });
}

function filterList() {
  const v = document.getElementById('sb-filter').value.toLowerCase();
  renderList(allQuizzes.filter(q => q.quiz.toLowerCase().includes(v)));
}

async function selectQuiz(q) {
  document.querySelectorAll('.q-item').forEach(e => e.classList.remove('active'));
  const el = document.querySelector(`[data-n="${q.quiz}"]`);
  if (el) el.classList.add('active');

  curQuiz = q.quiz; curEnabled = q.enabled;

  document.getElementById('mh-title').textContent = q.quiz;
  document.getElementById('mh-sub').textContent = 'Loading questions...';
  document.getElementById('mh-right').style.display = 'flex';
  document.getElementById('stats-bar').style.display = 'flex';

  const tgl = document.getElementById('tgl');
  tgl.className = 'toggle' + (q.enabled ? ' on' : '');
  document.getElementById('tgl-lbl').textContent = q.enabled ? 'Enabled' : 'Disabled';

  const body = document.getElementById('main-body');
  body.innerHTML = [1,2,3,4,5].map(()=>'<div class="skel"></div>').join('');

  try {
    const r = await fetch('/api/questions/'+q.quiz);
    questions = await r.json();
    document.getElementById('mh-sub').textContent = questions.length + ' questions';
    document.getElementById('st-q').textContent = questions.length;
    renderQuestions(questions);
    loadStats(q.quiz);
  } catch(e) {
    body.innerHTML = '<div class="empty"><div class="empty-title">Failed to load questions</div></div>';
  }
}

async function loadStats(quiz) {
  try {
    const r = await fetch('/api/quiz-stats/'+quiz);
    const s = await r.json();
    document.getElementById('st-r').textContent = s.total_responses || 0;
    document.getElementById('st-c').textContent = s.avg_correct ? Math.round(s.avg_correct)+'%' : '—';
  } catch(e) {}
}

function renderQuestions(qs) {
  const body = document.getElementById('main-body');
  if (!qs.length) {
    body.innerHTML = `<div class="empty">
      <svg viewBox="0 0 24 24" width="40" height="40" stroke="var(--text-3)" fill="none" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/></svg>
      <div class="empty-title">No questions yet</div>
      <div class="empty-sub">Click "Add question" to create the first one</div>
    </div>`;
    return;
  }
  body.innerHTML = '';
  qs.forEach(q => {
    const opts = Array.isArray(q.options) ? q.options :
      (typeof q.options === 'string' ? JSON.parse(q.options) : ['','','']);
    const ans = (q.answer || '').toUpperCase();

    const card = document.createElement('div');
    card.className = 'q-card';
    card.dataset.qn = q.question_number;

    const optRows = ['A','B','C'].map((l,i) => {
      const v = (opts[i] || '').replace(/^[A-Ca-c]\.\s*/,'');
      const isSel = ans === l;
      return `<div class="opt-row">
        <div class="opt-letter">${l}</div>
        <input class="opt-inp" type="text" placeholder="Option ${l}..." value="${escHtml(v)}" data-l="${l}">
        <button class="opt-chk${isSel?' sel':''}" data-l="${l}" onclick="setCorrect(this)">${CORRECT_SVG}</button>
      </div>`;
    }).join('');

    card.innerHTML = `
      <div class="q-head" onclick="toggleCard(this.parentElement)">
        <div class="q-num">Q${q.question_number}</div>
        <div class="q-prev">${escHtml(q.question || 'New question')}</div>
        <div class="q-chev">${CHEV_SVG}</div>
      </div>
      <div class="q-body">
        <div class="field">
          <div class="field-lbl">Question text</div>
          <textarea class="field-inp q-txt" rows="3" placeholder="Enter the question...">${escHtml(q.question || '')}</textarea>
        </div>
        <div class="field">
          <div class="field-lbl">Answer options — click ✓ to mark correct</div>
          <div class="opts">${optRows}</div>
        </div>
        <div class="field">
          <div class="field-lbl">Media URL (optional)</div>
          <input class="field-inp q-media" type="text" placeholder="Google Drive or YouTube link..." value="${escHtml(q.media_url||'')}">
        </div>
        <div class="q-actions">
          <button class="btn btn-primary" onclick="saveQ(this.closest('.q-card'))">Save</button>
          <button class="btn btn-secondary" onclick="toggleCard(this.closest('.q-card'))">Collapse</button>
          <button class="btn btn-danger" onclick="delQ(this.closest('.q-card'),${q.question_number})">Delete</button>
          <div class="saving" id="sav-${q.question_number}"><div class="spin"></div>Saving...</div>
        </div>
      </div>`;
    body.appendChild(card);
  });

  const addBtn = document.createElement('button');
  addBtn.className = 'add-q-btn';
  addBtn.innerHTML = PLUS_SVG + ' Add new question';
  addBtn.onclick = addQuestion;
  body.appendChild(addBtn);
}

function escHtml(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function toggleCard(card) {
  card.classList.toggle('open');
  if (!card.classList.contains('open')) {
    const txt = card.querySelector('.q-txt').value;
    if (txt) card.querySelector('.q-prev').textContent = txt;
  }
}

function setCorrect(btn) {
  btn.closest('.opts').querySelectorAll('.opt-chk').forEach(b => b.classList.remove('sel'));
  btn.classList.add('sel');
}

async function saveQ(card) {
  const qn = parseInt(card.dataset.qn);
  const qtext = card.querySelector('.q-txt').value.trim();
  const opts = Array.from(card.querySelectorAll('.opt-inp')).map(i => i.value.trim());
  const selBtn = card.querySelector('.opt-chk.sel');
  const ans = selBtn ? selBtn.dataset.l : null;
  const media = card.querySelector('.q-media').value.trim();

  if (!qtext) { toast('Question text cannot be empty','err'); return; }
  if (opts.some(o=>!o)) { toast('All three options must be filled in','err'); return; }
  if (!ans) { toast('Mark the correct answer first','err'); return; }

  const sav = document.getElementById('sav-'+qn);
  if (sav) sav.classList.add('on');
  card.classList.add('editing');

  try {
    const r = await fetch('/api/questions/update', {
      method:'PUT', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({quiz:curQuiz, question_number:qn, question:qtext, options:opts, answer:ans, media_url:media||null})
    });
    if (r.ok) {
      toast('Q'+qn+' saved','ok');
      card.querySelector('.q-prev').textContent = qtext;
    } else {
      const d = await r.json();
      toast(d.error||'Save failed','err');
    }
  } catch(e) { toast('Network error','err'); }
  finally {
    if (sav) sav.classList.remove('on');
    card.classList.remove('editing');
  }
}

async function addQuestion() {
  if (!curQuiz) return;
  const nextNum = questions.length ? Math.max(...questions.map(q=>q.question_number))+1 : 1;
  try {
    const r = await fetch('/api/questions/add', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({quiz:curQuiz, question_number:nextNum, question:'', options:['','',''], answer:'A'})
    });
    if (r.ok) {
      const nq = await r.json();
      questions.push(nq);
      renderQuestions(questions);
      const cards = document.querySelectorAll('.q-card');
      const last = cards[cards.length-1];
      if (last) { last.classList.add('open'); last.scrollIntoView({behavior:'smooth',block:'center'}); }
      document.getElementById('st-q').textContent = questions.length;
      toast('Q'+nextNum+' added — fill it in and save','ok');
    }
  } catch(e) { toast('Could not add question','err'); }
}

async function delQ(card, qn) {
  if (!confirm('Delete Q'+qn+'? This cannot be undone.')) return;
  try {
    const r = await fetch('/api/questions/delete', {
      method:'DELETE', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({quiz:curQuiz, question_number:qn})
    });
    if (r.ok) {
      card.style.cssText = 'opacity:0;transform:translateX(8px);transition:all 0.2s ease;overflow:hidden;';
      setTimeout(() => {
        card.remove();
        questions = questions.filter(q=>q.question_number!==qn);
        document.getElementById('st-q').textContent = questions.length;
      }, 200);
      toast('Q'+qn+' deleted','ok');
    } else { toast('Delete failed','err'); }
  } catch(e) { toast('Network error','err'); }
}

async function toggleEnabled() {
  if (!curQuiz) return;
  curEnabled = !curEnabled;
  const tgl = document.getElementById('tgl');
  tgl.className = 'toggle' + (curEnabled?' on':'');
  document.getElementById('tgl-lbl').textContent = curEnabled ? 'Enabled' : 'Disabled';
  try {
    await fetch('/api/quizzes/'+curQuiz, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({enabled:curEnabled})
    });
    toast(curQuiz+' '+(curEnabled?'enabled':'disabled'),'ok');
    const item = document.querySelector(`[data-n="${curQuiz}"]`);
    if (item) {
      item.className = 'q-item active ' + (curEnabled?'on':'off');
      const b = item.querySelector('.q-badge');
      b.className = 'q-badge ' + (curEnabled?'badge-on':'badge-off');
      b.textContent = curEnabled?'ON':'OFF';
    }
  } catch(e) { toast('Could not update status','err'); }
}

function toast(msg, type) {
  const c = document.getElementById('toasts');
  const t = document.createElement('div');
  t.className = 'toast toast-'+(type==='ok'?'ok':'err');
  const icon = type==='ok'
    ? `<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>`
    : `<svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>`;
  t.innerHTML = icon + msg;
  c.appendChild(t);
  setTimeout(() => { t.style.cssText='opacity:0;transition:opacity 0.25s'; setTimeout(()=>t.remove(),250); }, 3000);
}
</script>
</body>
</html>
